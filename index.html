<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --border:#e3e6eb; --text:#14171c; --muted:#5f6876;
  --accent:#2f5bea; --accent-ink:#ffffff; --accent-soft:#e8eefe;
  --ok:#177245; --ok-soft:#e3f5ea; --warn:#9a5b00; --warn-soft:#fff3dc; --bad:#b42318; --bad-soft:#fdecea;
  --info:#3b4bb8; --info-soft:#eceffd; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --panel-2:#1e222a; --border:#2a2f39; --text:#e8eaee; --muted:#9aa3b2;
    --accent:#6d8dff; --accent-ink:#0b0d12; --accent-soft:#1f2741;
    --ok:#4cc98a; --ok-soft:#14291f; --warn:#f0b54a; --warn-soft:#2c2413; --bad:#ff7a6e; --bad-soft:#331a18;
    --info:#9aa8ff; --info-soft:#1d2240; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --panel-2:#1e222a; --border:#2a2f39; --text:#e8eaee; --muted:#9aa3b2;
  --accent:#6d8dff; --accent-ink:#0b0d12; --accent-soft:#1f2741;
  --ok:#4cc98a; --ok-soft:#14291f; --warn:#f0b54a; --warn-soft:#2c2413; --bad:#ff7a6e; --bad-soft:#331a18;
  --info:#9aa8ff; --info-soft:#1d2240; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--panel-2);color:var(--text)}
nav a.active{background:var(--accent-soft);color:var(--accent)}
nav svg{width:17px;height:17px;flex:none}
.mode{margin-top:22px;padding:10px;border-radius:8px;background:var(--panel-2);font-size:12px;color:var(--muted)}
.mode b{color:var(--text);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok)} .dot.local{background:var(--warn)}
main{padding:24px 28px 60px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi .label{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .value{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .note{color:var(--muted);font-size:12px;margin-top:2px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.grid2>*{min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-width:0}
.toolbar input{flex:1;max-width:320px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel-2)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--panel-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.b-draft{background:var(--panel-2);color:var(--muted)}
.b-confirmed,.b-ordered{background:var(--info-soft);color:var(--info)}
.b-shipped,.b-received{background:var(--warn-soft);color:var(--warn)}
.b-paid{background:var(--ok-soft);color:var(--ok)}
.b-cancelled{background:var(--bad-soft);color:var(--bad)}
.low{color:var(--bad);font-weight:600}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.muted{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.modal footer .right{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.lines input,.lines select{border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 9px;color:var(--text);width:100%;min-width:0}
.lines{margin-top:14px}
.lines table th,.lines table td{padding:6px 6px;white-space:normal}
.lines td.num{white-space:nowrap}
.totals{display:flex;justify-content:flex-end;gap:18px;margin-top:10px;font-size:15px}
.totals b{font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:14px;font-size:13px}
.notice.hidden{display:none}
.gate{max-width:440px;margin:8vh auto 0;padding:24px}
.gate h1{margin-bottom:6px}
.gate form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.gate input{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:9px 11px}
.gate .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.mode .btn{margin-top:8px}
.mode .who{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:720px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:0;height:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--border);z-index:10}
  .brand{padding:6px 0 8px}
  nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  nav a{white-space:nowrap;padding:6px 10px}
  nav svg{display:none}
  .mode{margin:4px 0 6px;padding:6px 10px;font-size:11.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mode .btn{margin-top:0}
  main{padding:16px 16px 60px}
  .form{grid-template-columns:1fr}
  .bar{grid-template-columns:80px 1fr 80px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">E</span>Mini ERP</div>
    <nav id="nav"></nav>
    <div class="mode" id="mode"><b><span class="dot"></span>Connecting…</b></div>
  </aside>
  <main>
    <div class="notice hidden" id="notice"></div>
    <div id="view"></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
// ---------- icons ----------
const I = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  inventory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  sales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.5 12h11L21 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>',
  purchasing:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="13" height="10" rx="1"/><path d="M15 10h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg>',
  customers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>',
  suppliers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l6 4V9l6 4V5h6v16z"/></svg>'
};
const ROUTES = [
  ["dashboard","Dashboard"],["inventory","Inventory"],["sales","Sales orders"],
  ["purchasing","Purchasing"],["customers","Customers"],["suppliers","Suppliers"]
];
const COLS = ["products","customers","suppliers","sales","purchases"];

// ---------- state ----------
const S = {}; COLS.forEach(c => S[c] = {});
let backend = null;      // {kind, put(col,id,data), del(col,id)}
let readOnly = false;
const CFG = window.ERP_CONFIG || {};
const USE_SB = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const SB_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
let sb = null, sbStarted = false;
// gate: null when the app is usable, otherwise {kind:"loading"|"login"|"sent"|"denied", email, msg}
let gate = USE_SB ? {kind:"loading", msg:"Connecting…"} : null;
const ui = { q:{}, status:{} };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const money = v => new Intl.NumberFormat(undefined,{style:"currency",currency:"USD"}).format(num(v));
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const list = c => Object.entries(S[c]).map(([id,d]) => ({id, ...d}));
const name = (c,id) => (S[c][id] && S[c][id].name) || "—";
const orderTotal = o => (Array.isArray(o.lines)?o.lines:[]).reduce((s,l)=>s+num(l.qty)*num(l.price),0);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function nextNumber(col, prefix){
  let max=0; list(col).forEach(o=>{ const m=String(o.number||"").match(/(\d+)$/); if(m) max=Math.max(max,+m[1]); });
  return prefix + String(max+1).padStart(4,"0");
}

// ---------- persistence ----------
const writeChains = {};
function serialize(key, fn){ const p=(writeChains[key]||Promise.resolve()).catch(()=>{}).then(fn); writeChains[key]=p; return p; }

async function save(col, id, data){
  if (readOnly) { toast("You have view-only access."); throw new Error("readonly"); }
  S[col][id] = data; render();
  try { await backend.put(col,id,data); }
  catch(e){ handleWriteError(e); throw e; }
}
async function remove(col, id){
  if (readOnly) { toast("You have view-only access."); throw new Error("readonly"); }
  delete S[col][id]; render();
  try { await backend.del(col,id); }
  catch(e){ handleWriteError(e); throw e; }
}
function handleWriteError(e){
  const code = e && e.code;
  if (code === "invalid_argument") { readOnly = true; setNotice("You can view this ERP but not change it. Ask the owner for edit access."); }
  else if (code === "quota_exceeded") toast("Storage is full. Delete some old records and try again.");
  else toast("Couldn't save. Check your connection and try again.");
  render();
}

function localBackend(){
  const KEY="mini-erp-local-v1";
  try { const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); COLS.forEach(c=>{ if(d[c]&&typeof d[c]==="object") S[c]=d[c]; }); } else seedDemo(); }
  catch(_) { seedDemo(); }
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){} };
  persist();
  return { kind:"local", put:async()=>persist(), del:async()=>persist() };
}

function dbBackend(db){
  return {
    kind:"db",
    put:(col,id,data)=>serialize(col+"/"+id, ()=>db.collection(col).doc(id).set(data)),
    del:(col,id)=>serialize(col+"/"+id, ()=>db.collection(col).doc(id).delete())
  };
}

// ---------- Supabase (shared database with email sign-in) ----------
function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load failed")); document.head.appendChild(s); });
}
function sbBackend(){
  const run = async q => {
    const { error } = await q;
    if (error) throw { code: error.code === "42501" ? "invalid_argument" : "unavailable", message: error.message };
  };
  return {
    kind:"supabase",
    put:(col,id,data)=>serialize(col+"/"+id, ()=>run(sb.from("erp_records").upsert({col,id,data}))),
    del:(col,id)=>serialize(col+"/"+id, ()=>run(sb.from("erp_records").delete().eq("col",col).eq("id",id)))
  };
}
async function startSupabase(){
  booted = true; setMode("connecting"); render();
  try { await loadScript(SB_CDN); }
  catch(_) { gate={kind:"loading", msg:"Couldn't load the database library. Check your connection and reload the page."}; return render(); }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  // Supabase calls inside this callback can deadlock, so hand off with setTimeout.
  sb.auth.onAuthStateChange((_event, session)=>{ if (session && !sbStarted) setTimeout(()=>sbAfterLogin(session), 0); });
  const { data } = await sb.auth.getSession();
  if (data && data.session) sbAfterLogin(data.session);
  else if (!sbStarted) { gate={kind:"login"}; setMode("signedout"); render(); }
}
async function sbAfterLogin(session){
  if (sbStarted) return; sbStarted = true;
  const email = String(session.user && session.user.email || "").toLowerCase();
  gate = {kind:"loading", msg:"Loading data…"}; setMode("supabase", email); render();
  const allow = await sb.from("erp_allowed_emails").select("email").limit(1);
  if (allow.error || !allow.data || !allow.data.length) { gate={kind:"denied", email}; return render(); }
  COLS.forEach(c => S[c] = {});
  const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const r = await sb.from("erp_records").select("col,id,data").range(from, from + PAGE - 1);
    if (r.error) { gate={kind:"loading", msg:"Couldn't load data: " + r.error.message}; return render(); }
    r.data.forEach(row => { if (S[row.col]) S[row.col][row.id] = row.data; });
    if (r.data.length < PAGE) break;
  }
  backend = sbBackend(); gate = null; render();
  sb.channel("erp-records")
    .on("postgres_changes", {event:"*", schema:"public", table:"erp_records"}, p => {
      if (p.eventType === "DELETE") { const o = p.old || {}; if (S[o.col]) delete S[o.col][o.id]; }
      else { const n = p.new || {}; if (S[n.col]) S[n.col][n.id] = n.data; }
      if (!$("#overlay").classList.contains("open")) render(); else renderNav();
    })
    .subscribe(status => {
      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setNotice("Live updates paused. Reload the page to see other people's latest changes.");
      else if (status === "SUBSCRIBED" && !readOnly) setNotice("");
    });
}
function gateView(){
  const g = gate;
  if (g.kind === "loading") return `<div class="card gate"><h1>Mini ERP</h1><div class="sub">${esc(g.msg || "Loading…")}</div></div>`;
  if (g.kind === "denied") return `<div class="card gate"><h1>No access yet</h1><div class="sub"><b>${esc(g.email)}</b> isn't on this ERP's approved list. Ask the owner to add your email, then reload this page.</div><div class="actions"><button class="btn" data-act="signout">Sign out</button></div></div>`;
  if (g.kind === "sent") return `<div class="card gate"><h1>Check your email</h1><div class="sub">We sent a sign-in link to <b>${esc(g.email)}</b>. Open it in this browser to continue.</div><div class="actions"><button class="btn" data-act="gate-back">Use a different email</button></div></div>`;
  return `<div class="card gate"><h1>Sign in to Mini ERP</h1><div class="sub">Enter your email and we'll send you a sign-in link. Only approved emails can open the data.</div>
    <form id="gate-form"><input type="email" name="email" required placeholder="you@example.com" autocomplete="email" value="${esc(g.email || "")}">
    <button class="btn primary" type="submit">Send sign-in link</button><div class="err">${esc(g.msg || "")}</div></form></div>`;
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "gate-form") return;
  e.preventDefault();
  const email = e.target.email.value.trim();
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  const msg = error && (/fetch|network/i.test(error.message) ? "Couldn't reach the database. Check your connection and the settings in config.js." : error.message);
  gate = error ? {kind:"login", email, msg} : {kind:"sent", email};
  render();
});

function seedDemo(){
  const p = (sku,name,category,unit,cost,price,stock,reorder)=>{ S.products[sku.toLowerCase()]={sku,name,category,unit,cost,price,stock,reorder}; };
  p("CHR-100","Ergonomic office chair","Furniture","pcs",92,189,24,10);
  p("DSK-200","Standing desk 140cm","Furniture","pcs",210,429,8,5);
  p("MON-27","27\" 4K monitor","Electronics","pcs",180,329,15,8);
  p("KBD-01","Wireless keyboard","Electronics","pcs",22,49,60,25);
  p("CBL-USBC","USB-C cable 2m","Accessories","pcs",3,12,140,50);
  p("LMP-10","LED desk lamp","Accessories","pcs",14,39,4,10);
  S.customers.c1={name:"Northwind Studio",email:"buy@northwind.example",phone:"555-0101",city:"Portland"};
  S.customers.c2={name:"Bluebird Clinics",email:"ops@bluebird.example",phone:"555-0144",city:"Denver"};
  S.customers.c3={name:"Harbor Legal LLP",email:"office@harbor.example",phone:"555-0190",city:"Boston"};
  S.suppliers.s1={name:"Atlas Furniture Co.",email:"sales@atlas.example",phone:"555-0210",city:"Grand Rapids"};

// ---------- shell ----------
function setNotice(msg){ const n=$("#notice"); n.textContent=msg||""; n.classList.toggle("hidden",!msg); }
function setMode(kind, email){
  const m=$("#mode");
  if(kind==="db") m.innerHTML='<b><span class="dot live"></span>Shared database</b>Changes sync live for everyone with access.';
  else if(kind==="supabase") m.innerHTML=`<div style="min-width:0"><b><span class="dot live"></span>Shared database</b><span class="who">${esc(email||"")}</span></div><button class="btn sm" data-act="signout">Sign out</button>`;

function route(){ const h=(location.hash||"").slice(1); return ROUTES.some(r=>r[0]===h)?h:"dashboard"; }
function renderNav(){
  const r=route();
  $("#nav").innerHTML = ROUTES.map(([k,label])=>`<a href="#${k}" class="${k===r?"active":""}">${I[k]}${label}</a>`).join("");
}
function render(){
  renderNav();
  const r=route(), v=$("#view");
  if(gate){ v.innerHTML=gateView(); const i=v.querySelector("#gate-form input"); if(i&&document.activeElement===document.body) i.focus(); return; }
  const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.keep;
  const caret = focus ? document.activeElement.selectionStart : null;
  v.innerHTML = VIEWS[r]();
  if(focus){ const el=v.querySelector(`[data-keep="${focus}"]`); if(el){ el.focus(); try{el.setSelectionRange(caret,caret);}catch(_){} } }
  document.querySelectorAll("[data-ro]").forEach(b=>b.disabled=readOnly);
}

// ---------- views ----------
const VIEWS = {
  dashboard(){
    const sales=list("sales"), pur=list("purchases"), prods=list("products");

    const ar = sales.filter(o=>o.status==="shipped").reduce((s,o)=>s+orderTotal(o),0);
    const ap = pur.filter(o=>o.status==="received").reduce((s,o)=>s+orderTotal(o),0);
    const invVal = prods.reduce((s,p)=>s+num(p.stock)*num(p.cost),0);
    const low = prods.filter(p=>num(p.stock)<=num(p.reorder)).sort((a,b)=>num(a.stock)-num(b.stock));
    const open = sales.filter(o=>o.status==="confirmed"||o.status==="draft");
    const recent = [...sales.map(o=>({...o,kind:"sales"})),...pur.map(o=>({...o,kind:"purchases"}))]
      .sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,7);
    // revenue by customer
    const byCust={}; sales.filter(o=>o.status==="paid"||o.status==="shipped").forEach(o=>{ byCust[o.customerId]=(byCust[o.customerId]||0)+orderTotal(o); });
    const top=Object.entries(byCust).sort((a,b)=>b[1]-a[1]).slice(0,5); const max=top.length?top[0][1]:1;
    return `
    <div class="head"><div><h1>Dashboard</h1><div class="sub">Overview of sales, purchasing and stock</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="new-po" data-ro>New purchase</button><button class="btn primary" data-act="new-so" data-ro>New sales order</button></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="label">Revenue collected</div><div class="value">${money(revenue)}</div><div class="note">${sales.filter(o=>o.status==="paid").length} paid orders</div></div>
      <div class="card kpi"><div class="label">Receivables</div><div class="value">${money(ar)}</div><div class="note">Shipped, awaiting payment</div></div>
      <div class="card kpi"><div class="label">Payables</div><div class="value">${money(ap)}</div><div class="note">Received, not yet paid</div></div>
      <div class="card kpi"><div class="label">Inventory value</div><div class="value">${money(invVal)}</div><div class="note">${prods.length} products at cost</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Recent activity</h2>
        ${recent.length?`<div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Number</th><th>Party</th><th>Date</th><th>Status</th><th class="num">Total</th></tr></thead><tbody>
        ${recent.map(o=>`<tr class="click" data-open="${o.kind}" data-id="${esc(o.id)}"><td>${esc(o.number)}</td><td>${esc(o.kind==="sales"?name("customers",o.customerId):name("suppliers",o.supplierId))}</td><td>${esc(o.date)}</td><td>${badge(o.status)}</td><td class="num">${money(orderTotal(o))}</td></tr>`).join("")}
        </tbody></table></div>`:`<div class="empty">No orders yet.</div>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card"><h2>Low stock (${low.length})</h2>
          ${low.length?`<ul class="list">${low.map(p=>`<li><span>${esc(p.name)} <span class="muted">${esc(p.sku)}</span></span><span class="low">${num(p.stock)} / ${num(p.reorder)}</span></li>`).join("")}</ul>`:`<div class="muted">All products are above their reorder point.</div>`}
        </div>
        <div class="card"><h2>Top customers</h2>
          ${top.length?`<div class="bars">${top.map(([id,v])=>`<div class="bar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name("customers",id))}</span><div class="track"><div class="fill" style="width:${Math.max(3,v/max*100)}%"></div></div><span class="num">${money(v)}</span></div>`).join("")}</div>`:`<div class="muted">No shipped or paid orders yet.</div>`}
        </div>
        <div class="card"><h2>Open sales orders</h2><div class="muted">${open.length} order${open.length===1?"":"s"} waiting to ship, worth ${money(open.reduce((s,o)=>s+orderTotal(o),0))}.</div></div>
      </div>
    </div>`;
  },
  inventory(){
    const q=(ui.q.inventory||"").toLowerCase();
    const rows=list("products").filter(p=>!q||[p.sku,p.name,p.category].join(" ").toLowerCase().includes(q)).sort((a,b)=>String(a.sku).localeCompare(String(b.sku)));
    return `
    <div class="head"><div><h1>Inventory</h1><div class="sub">${list("products").length} products</div></div><button class="btn primary" data-act="new-product" data-ro>Add product</button></div>
    <div class="toolbar"><input type="search" placeholder="Search SKU, name, category" data-search="inventory" data-keep="s-inv" value="${esc(ui.q.inventory||"")}"></div>
    <div class="tablewrap"><table><thead><tr><th>SKU</th><th>Name</th><th>Category</th><th class="num">On hand</th><th class="num">Reorder at</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Margin</th></tr></thead><tbody>
    ${rows.map(p=>{const m=num(p.price)?((num(p.price)-num(p.cost))/num(p.price)*100):0; return `<tr class="click" data-open="products" data-id="${esc(p.id)}"><td>${esc(p.sku)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td class="num ${num(p.stock)<=num(p.reorder)?"low":""}">${num(p.stock)} ${esc(p.unit)}</td><td class="num">${num(p.reorder)}</td><td class="num">${money(p.cost)}</td><td class="num">${money(p.price)}</td><td class="num">${m.toFixed(0)}%</td></tr>`}).join("")}
    </tbody></table>${rows.length?"":`<div class="empty">${q?"No products match.":"No products yet. Add your first one."}</div>`}</div>`;
  },
  sales(){ return orderList("sales"); },
  purchasing(){ return orderList("purchases"); },
  customers(){ return partyList("customers"); },
  suppliers(){ return partyList("suppliers"); }
};

const FLOW = {
  sales:{ steps:["draft","confirmed","shipped","paid"], party:"customerId", partyCol:"customers", prefix:"SO-", title:"Sales orders", noun:"sales order",
    next:{draft:["confirmed","Confirm"],confirmed:["shipped","Ship (take stock out)"],shipped:["paid","Mark paid"]} },
  purchases:{ steps:["draft","ordered","received","paid"], party:"supplierId", partyCol:"suppliers", prefix:"PO-", title:"Purchasing", noun:"purchase order",
    next:{draft:["ordered","Send to supplier"],ordered:["received","Receive (add stock)"],received:["paid","Mark paid"]} }
};
function badge(s){ return `<span class="badge b-${esc(s)}">${esc(String(s||"").replace(/^./,c=>c.toUpperCase()))}</span>`; }

function orderList(col){
  const F=FLOW[col], key=col, q=(ui.q[key]||"").toLowerCase(), st=ui.status[key]||"";
  const rows=list(col).filter(o=>(!st||o.status===st)&&(!q||[o.number,name(F.partyCol,o[F.party])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>String(b.number).localeCompare(String(a.number)));
  return `
  <div class="head"><div><h1>${F.title}</h1><div class="sub">${list(col).length} orders · ${money(rows.reduce((s,o)=>s+orderTotal(o),0))} shown</div></div>
    <button class="btn primary" data-act="${col==="sales"?"new-so":"new-po"}" data-ro>New ${F.noun}</button></div>
  <div class="toolbar"><input type="search" placeholder="Search number or ${col==="sales"?"customer":"supplier"}" data-search="${key}" data-keep="s-${key}" value="${esc(ui.q[key]||"")}">
    <select data-status="${key}"><option value="">All statuses</option>${[...F.steps,"cancelled"].map(s=>`<option value="${s}" ${s===st?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></div>
  <div class="tablewrap"><table><thead><tr><th>Number</th><th>${col==="sales"?"Customer":"Supplier"}</th><th>Date</th><th class="num">Items</th><th>Status</th><th class="num">Total</th></tr></thead><tbody>
  ${rows.map(o=>`<tr class="click" data-open="${col}" data-id="${esc(o.id)}"><td>${esc(o.number)}</td><td>${esc(name(F.partyCol,o[F.party]))}</td><td>${esc(o.date)}</td><td class="num">${(o.lines||[]).reduce((s,l)=>s+num(l.qty),0)}</td><td>${badge(o.status)}</td><td class="num">${money(orderTotal(o))}</td></tr>`).join("")}
  </tbody></table>${rows.length?"":`<div class="empty">No orders${q||st?" match":" yet"}.</div>`}</div>`;
}

function partyList(col){
  const q=(ui.q[col]||"").toLowerCase(), isC=col==="customers";
  const ordersCol=isC?"sales":"purchases", fk=isC?"customerId":"supplierId";
  const rows=list(col).filter(p=>!q||[p.name,p.email,p.city].join(" ").toLowerCase().includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  return `
  <div class="head"><div><h1>${isC?"Customers":"Suppliers"}</h1><div class="sub">${list(col).length} records</div></div><button class="btn primary" data-act="new-${col}" data-ro>Add ${isC?"customer":"supplier"}</button></div>
  <div class="toolbar"><input type="search" placeholder="Search name, email, city" data-search="${col}" data-keep="s-${col}" value="${esc(ui.q[col]||"")}"></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th class="num">Orders</th><th class="num">${isC?"Billed":"Spent"}</th></tr></thead><tbody>
  ${rows.map(p=>{const os=list(ordersCol).filter(o=>o[fk]===p.id&&o.status!=="cancelled"&&o.status!=="draft"); return `<tr class="click" data-open="${col}" data-id="${esc(p.id)}"><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.phone)}</td><td>${esc(p.city)}</td><td class="num">${os.length}</td><td class="num">${money(os.reduce((s,o)=>s+orderTotal(o),0))}</td></tr>`}).join("")}
  </tbody></table>${rows.length?"":`<div class="empty">${q?"Nothing matches.":"None yet."}</div>`}</div>`;
}

// ---------- modals ----------
function openModal(html, wide){ const m=$("#modal"); m.className="modal"+(wide?" wide":""); m.innerHTML=html; $("#overlay").classList.add("open"); const f=m.querySelector("input,select"); if(f) f.focus(); }
function closeModal(){ $("#overlay").classList.remove("open"); $("#modal").innerHTML=""; }
$("#overlay").addEventListener("mousedown",e=>{ if(e.target.id==="overlay") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#overlay").classList.contains("open")) closeModal(); });

function field(label,nameAttr,val,type="text",extra=""){ return `<label class="f ${extra}">${label}<input name="${nameAttr}" type="${type}" value="${esc(val??"")}" ${type==="number"?'step="any" min="0"':""}></label>`; }

function productModal(id){

function partyModal(col,id){
  const p=id?S[col][id]:{}; const noun=col==="customers"?"customer":"supplier";
  openModal(`<header><h3>${id?"Edit":"New"} ${noun}</h3><button class="x" data-close aria-label="Close">×</button></header>
  <form class="body" id="frm"><div class="form">
    ${field("Name","name",p.name,"text","full")}${field("Email","email",p.email,"email")}${field("Phone","phone",p.phone)}${field("City","city",p.city,"text","full")}
  </div><div class="err" id="err"></div></form>
  <footer>${id?`<button class="btn danger" data-del="${col}" data-id="${esc(id)}" data-ro>Delete</button>`:""}<div class="right"><button class="btn" data-close>Cancel</button><button class="btn primary" data-submit data-ro>Save</button></div></footer>`);

function orderModal(col,id){
  const F=FLOW[col]; const isSale=col==="sales";
  const o=id?JSON.parse(JSON.stringify(S[col][id])):{number:nextNumber(col,F.prefix),date:today(),status:"draft",lines:[],[F.party]:""};
  if(!Array.isArray(o.lines)) o.lines=[];
  const editable=o.status==="draft";
  const parties=list(F.partyCol).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const prods=list("products").sort((a,b)=>String(a.sku).localeCompare(String(b.sku)));
  if(editable&&!o.lines.length) o.lines.push({productId:"",qty:1,price:0});

  const draw=()=>{
    const lineRows=o.lines.map((l,i)=>{
      const p=S.products[l.productId];
      if(!editable) return `<tr><td>${esc(p?p.sku+" · "+p.name:"(deleted product)")}</td><td class="num">${num(l.qty)}</td><td class="num">${money(l.price)}</td><td class="num">${money(num(l.qty)*num(l.price))}</td><td></td></tr>`;
      return `<tr><td><select data-line="${i}" data-k="productId"><option value="">Select product…</option>${prods.map(x=>`<option value="${esc(x.id)}" ${x.id===l.productId?"selected":""}>${esc(x.sku)} · ${esc(x.name)}${isSale?` (${num(x.stock)} on hand)`:""}</option>`).join("")}</select></td>
      <td style="width:90px"><input type="number" min="0" step="any" data-line="${i}" data-k="qty" value="${esc(l.qty)}"></td>
      <td style="width:110px"><input type="number" min="0" step="any" data-line="${i}" data-k="price" value="${esc(l.price)}"></td>
      <td class="num">${money(num(l.qty)*num(l.price))}</td><td><button class="x" type="button" data-rmline="${i}" aria-label="Remove line">×</button></td></tr>`;
    }).join("");
    const nx=F.next[o.status];
    openModal(`<header><h3>${esc(o.number)} ${badge(o.status)}</h3><button class="x" data-close aria-label="Close">×</button></header>
    <form class="body" id="frm"><div class="form">
      <label class="f">${isSale?"Customer":"Supplier"}<select name="party" ${editable?"":"disabled"}><option value="">Select…</option>${parties.map(p=>`<option value="${esc(p.id)}" ${p.id===o[F.party]?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
      <label class="f">Date<input type="date" name="date" value="${esc(o.date)}" ${editable?"":"disabled"}></label>
    </div>
    <div class="lines"><table><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">${isSale?"Unit price":"Unit cost"}</th><th class="num">Line total</th><th></th></tr></thead><tbody>${lineRows}</tbody></table>
      ${editable?`<button class="btn sm" type="button" data-addline style="margin-top:8px">+ Add line</button>`:""}
      <div class="totals"><span class="muted">Total</span><b>${money(orderTotal(o))}</b></div></div>
    <div class="muted" style="font-size:12.5px;margin-top:6px">Flow: ${F.steps.map(s=>s===o.status?`<b>${s}</b>`:s).join(" → ")}</div>
    <div class="err" id="err"></div></form>
    <footer>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${o.status==="draft"&&id?`<button class="btn danger" type="button" data-del="${col}" data-id="${esc(id)}" data-ro>Delete</button>`:""}
        ${(o.status==="draft"||o.status==="confirmed"||o.status==="ordered")&&id?`<button class="btn danger" type="button" data-cancel data-ro>Cancel order</button>`:""}
      </div>
      <div class="right"><button class="btn" type="button" data-close>Close</button>
        ${editable?`<button class="btn" type="button" data-submit data-ro>Save draft</button>`:""}
        ${nx?`<button class="btn primary" type="button" data-advance data-ro>${esc(nx[1])}</button>`:""}
      </div></footer>`, true);
    document.querySelectorAll("[data-ro]").forEach(b=>b.disabled=readOnly);
    wire();
  };
  const readHeader=()=>{ const f=$("#frm"); if(!f||!editable) return; o[F.party]=f.party.value; o.date=f.date.value||today(); };
  const err=m=>{ const e=$("#err"); if(e) e.textContent=m||""; };
  const validate=()=>{
    if(!o[F.party]) return `Choose a ${isSale?"customer":"supplier"}.`;
    const lines=o.lines.filter(l=>l.productId);
    if(!lines.length) return "Add at least one product line.";
    if(lines.some(l=>num(l.qty)<=0)) return "Each line needs a quantity above zero.";
    return "";
  };
  const persist=async(status)=>{
    const clean={number:o.number,date:o.date,status,[F.party]:o[F.party],lines:o.lines.filter(l=>l.productId).map(l=>({productId:l.productId,qty:num(l.qty),price:num(l.price)}))};
    await save(col, id||(id=uid()), clean); o.status=status;
  };
  const wire=()=>{
    const m=$("#modal");
    m.querySelectorAll("[data-line]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{
      readHeader();
      const l=o.lines[+el.dataset.line], k=el.dataset.k;
      l[k]= k==="productId"?el.value:el.value;
      if(k==="productId"){ const p=S.products[el.value]; if(p) l.price=isSale?num(p.price):num(p.cost); draw(); }
      else { const row=el.closest("tr"); row.querySelector("td.num").textContent=money(num(l.qty)*num(l.price)); m.querySelector(".totals b").textContent=money(orderTotal(o)); }
    }));
    m.querySelectorAll("[data-rmline]").forEach(b=>b.onclick=()=>{ readHeader(); o.lines.splice(+b.dataset.rmline,1); draw(); });
    const add=m.querySelector("[data-addline]"); if(add) add.onclick=()=>{ readHeader(); o.lines.push({productId:"",qty:1,price:0}); draw(); };
    const sub=m.querySelector("[data-submit]"); if(sub) sub.onclick=async()=>{ readHeader(); const v=validate(); if(v) return err(v); try{ await persist("draft"); toast("Draft saved"); closeModal(); }catch(_){} };
    const cancel=m.querySelector("[data-cancel]"); if(cancel) cancel.onclick=async()=>{ cancel.textContent="Click again to cancel"; if(cancel.dataset.armed){ try{ await persist("cancelled"); toast("Order cancelled"); closeModal(); }catch(_){} } cancel.dataset.armed="1"; };
    const adv=m.querySelector("[data-advance]"); if(adv) adv.onclick=async()=>{
      readHeader(); const v=validate(); if(v) return err(v);
      const to=F.next[o.status][0];
      // stock movements
      const moves=[];
      if((isSale&&to==="shipped")||(!isSale&&to==="received")){
        const need={}; o.lines.filter(l=>l.productId).forEach(l=>need[l.productId]=(need[l.productId]||0)+num(l.qty));
        for(const [pid,q] of Object.entries(need)){
          const p=S.products[pid]; if(!p) return err("One of the products on this order no longer exists.");
          if(isSale&&num(p.stock)<q) return err(`Not enough stock for ${p.sku}: ${num(p.stock)} on hand, ${q} needed.`);
          moves.push([pid,{...p,stock:num(p.stock)+(isSale?-q:q)}]);
        }
      }
      adv.disabled=true;
      try{
        for(const [pid,d] of moves) await save("products",pid,d);
        await persist(to);
        toast(to==="shipped"?"Shipped, stock updated":to==="received"?"Received, stock updated":`Marked ${to}`);
        closeModal();
      }catch(_){ adv.disabled=false; }
    };
  };
  draw();
}

function bindSubmit(fn){
  const m=$("#modal"), f=$("#frm");
  const go=async e=>{ if(e) e.preventDefault(); const fd=Object.fromEntries(new FormData(f).entries()); try{ const r=await fn(fd); if(typeof r==="string"){ $("#err").textContent=r; return; } closeModal(); }catch(_){} };
  f.addEventListener("submit",go);
  m.querySelector("[data-submit]").onclick=go;
}

// ---------- global events ----------
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-close],[data-open],[data-act],[data-del]"); if(!t) return;
  if(t.hasAttribute("data-close")) return closeModal();
  if(t.dataset.open){ const c=t.dataset.open,id=t.dataset.id; if(!S[c][id]) return;
    if(c==="products") productModal(id); else if(c==="sales"||c==="purchases") orderModal(c,id); else partyModal(c,id); return; }
  if(t.dataset.act){ const a=t.dataset.act;
    if(a==="signout"){ try{ if(sb) await sb.auth.signOut(); }catch(_){} location.reload(); return; }
    if(a==="gate-back"){ gate={kind:"login", email:gate&&gate.email}; render(); return; }
    if(gate) return;
    if(a==="new-product") productModal();
    else if(a==="new-so") { if(!list("customers").length) return toast("Add a customer first."); orderModal("sales"); }
    else if(a==="new-po") { if(!list("suppliers").length) return toast("Add a supplier first."); orderModal("purchases"); }
    else if(a==="new-customers") partyModal("customers");
    else if(a==="new-suppliers") partyModal("suppliers");
    return; }
  if(t.dataset.del){
    if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Click again to delete"; return; }
    const c=t.dataset.del,id=t.dataset.id;
    if(c==="products"&&[...list("sales"),...list("purchases")].some(o=>(o.lines||[]).some(l=>l.productId===id))) { $("#err").textContent="This product is used on orders, so it can't be deleted."; return; }
    if(c==="customers"&&list("sales").some(o=>o.customerId===id)) { $("#err").textContent="This customer has orders, so it can't be deleted."; return; }
    if(c==="suppliers"&&list("purchases").some(o=>o.supplierId===id)) { $("#err").textContent="This supplier has orders, so it can't be deleted."; return; }
    try{ await remove(c,id); toast("Deleted"); closeModal(); }catch(_){}
  }
});
document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.search; if(k!==undefined){ ui.q[k]=e.target.value; render(); } });
document.addEventListener("change",e=>{ const k=e.target.dataset&&e.target.dataset.status; if(k!==undefined){ ui.status[k]=e.target.value; render(); } });
window.addEventListener("hashchange",render);

// ---------- boot ----------
render();
let booted=false;
function startLocal(){ if(booted) return; booted=true; backend=localBackend(); setMode("local"); render(); }
if(USE_SB) startSupabase();
else (async()=>{
  let db=null;
  try{ if(window.claude&&typeof window.claude.use==="function") db=await window.claude.use("db"); }catch(_){ db=null; }
  if(!db) return startLocal();
  booted=true; backend=dbBackend(db); setMode("db");
  try{ const user=await window.claude.use("user"); if(user&&typeof user.can==="function"){ const w=await user.can("data.write"); if(w===false){ readOnly=true; setNotice("You can view this ERP but not change it. Ask the owner for Contributor access."); } } }catch(_){}
  let pending=new Set(COLS);
  const timer=setTimeout(()=>{ if(pending.size) setNotice("The shared database can't be reached yet. Showing what has loaded so far."); },10000);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const next={}; snap.docs.forEach(d=>{ if(d.exists) next[d.id]=d.data(); });
      S[c]=next;
      if(!snap.metadata.fromCache && pending.delete(c) && !pending.size){ clearTimeout(timer); if(!readOnly) setNotice(""); }
      if(!$("#overlay").classList.contains("open")) render(); else renderNav();
    },err=>{
      pending.delete(c);
      if(err&&err.code==="revoked") setNotice("Access to this data has ended.");
      else setNotice("Live updates stopped. Reopen the page to reconnect.");
    });
  });
  render();
})();
})();
</script>
